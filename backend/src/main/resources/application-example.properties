server.port=8080
server.servlet.context-path=/api

spring.datasource.url=jdbc:mysql://localhost:3306/financial_platform
spring.datasource.username=YOUR_DATABASE_USERNAME
spring.datasource.password=YOUR_DATABASE_PASSWORD

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=YOUR_JWT_SECRET
jwt.expiration=86400000
jwt.refresh-expiration=604800000

yahoo.finance.base-url=https://query1.finance.yahoo.com
yahoo.finance.chart-url=https://query1.finance.yahoo.com/v8/finance/chart
yahoo.finance.search-url=https://query2.finance.yahoo.com/v1/finance/search

cache.stock.ttl=300

gemini.api-key=YOUR_GEMINI_API_KEY
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.model=gemini-1.5-flash
gemini.max-output-tokens=1024
gemini.temperature=0.4